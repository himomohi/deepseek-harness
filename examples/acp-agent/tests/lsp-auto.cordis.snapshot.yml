# Keyless replay keeps the lsp-auto composition intact and replaces only the model adapter.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: lsp
            name: '@deepseek-ai/dsh-lsp'
          - id: lsp-auto
            name: '@deepseek-ai/dsh-lsp-auto'
            config:
              deferred: false
          - id: timeout-policy
            name: '@deepseek-ai/dsh-tool-call-timeout-policy'
          - id: tool-lsp
            name: '@deepseek-ai/dsh-tool-lsp'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
